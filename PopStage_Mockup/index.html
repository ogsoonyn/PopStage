<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PopStage 操作モック</title>
<link rel="stylesheet" href="daisyui.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
<style>
  /* レイアウト: 上にコマンドバー、左にツール、中央に3Dビュー、右にプロパティ。狭い画面では縦に積む */
  :root { --stage-a: #dfe6ee; --stage-b: #eef2f6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage-a: #1b2028; --stage-b: #232a34; } }
  :root[data-theme="dark"] { --stage-a: #1b2028; --stage-b: #232a34; }
  html, body { height: 100%; }
  #stage { background: repeating-conic-gradient(var(--stage-a) 0 25%, var(--stage-b) 0 50%) 0 0 / 28px 28px; touch-action: none; }
  #view { display: block; width: 100%; height: 100%; }
  .row { display: grid; grid-template-columns: 5.5rem 1fr 3rem; align-items: center; gap: .5rem; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .tool[aria-pressed="true"] { background: var(--color-primary); color: var(--color-primary-content); }
</style>
</head>
<body class="bg-base-200 text-base-content flex flex-col text-sm">

<header class="flex flex-wrap items-center gap-2 px-4 py-2 bg-base-100 border-b border-base-300">
  <h1 class="font-bold text-base mr-2">PopStage <span class="badge badge-neutral badge-sm align-middle">操作モック</span></h1>
  <label class="btn btn-sm btn-primary">画像を開く<input id="file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"></label>
  <button id="btnSample" class="btn btn-sm">サンプルに戻す</button>
  <div class="join">
    <button id="btnUndo" class="btn btn-sm join-item" disabled>元に戻す</button>
    <button id="btnRedo" class="btn btn-sm join-item" disabled>やり直す</button>
  </div>
  <button id="btnClear" class="btn btn-sm">塗りを全消去</button>
  <button id="btnView" class="btn btn-sm">視点リセット</button>
  <span class="ml-auto opacity-70 tabular-nums" id="stats">-</span>
</header>

<main class="flex-1 min-h-0 flex flex-col md:flex-row">
  <nav class="flex md:flex-col gap-1 p-2 bg-base-100 border-b md:border-b-0 md:border-r border-base-300" aria-label="ツール">
    <button class="tool btn btn-sm md:w-20" data-tool="brush" aria-pressed="true" title="塗る (B)">塗る</button>
    <button class="tool btn btn-sm md:w-20" data-tool="erase" aria-pressed="false" title="消す (E)">消す</button>
    <button class="tool btn btn-sm md:w-20" data-tool="smooth" aria-pressed="false" title="ぼかす (S)">ぼかす</button>
    <button class="tool btn btn-sm md:w-20" data-tool="grab" aria-pressed="false" title="つかんで揺らす (G)">つかむ</button>
    <button class="tool btn btn-sm md:w-20" data-tool="view" aria-pressed="false" title="視点を回す (V)">視点</button>
  </nav>

  <section class="flex-1 min-h-[45vh] md:min-h-0 relative">
    <div id="stage" class="absolute inset-0"><canvas id="view"></canvas></div>
    <div class="absolute left-3 top-3 right-3 flex flex-wrap items-center gap-3 bg-base-100 rounded-box px-3 py-2 w-fit max-w-full shadow">
      <label class="flex items-center gap-2">サイズ <input id="size" type="range" min="8" max="320" value="110" class="range range-xs w-28"><output id="sizeO" class="w-12 tabular-nums">110px</output></label>
      <label class="flex items-center gap-2">強さ <input id="strength" type="range" min="1" max="100" value="30" class="range range-xs w-28"><output id="strengthO" class="w-10 tabular-nums">30%</output></label>
    </div>
    <p id="hint" class="absolute left-3 bottom-3 right-3 w-fit max-w-full bg-base-100 rounded-box px-3 py-2 shadow pointer-events-none">
      左ドラッグ: 選択中のツール ／ 右ドラッグ: 視点を回す ／ 中ドラッグ: 平行移動 ／ ホイール: ズーム
    </p>
  </section>

  <aside class="md:w-80 shrink-0 overflow-y-auto bg-base-100 border-t md:border-t-0 md:border-l border-base-300 p-4 flex flex-col gap-5">
    <section class="flex flex-col gap-2">
      <h2 class="font-bold">ポップ(持ち上げ)</h2>
      <div class="row"><label for="pop">ポップ量</label><input id="pop" type="range" min="-300" max="400" value="140" class="range range-xs"><output id="popO"></output></div>
    </section>

    <section class="flex flex-col gap-2">
      <h2 class="font-bold">揺れ</h2>
      <div class="row"><label for="preset">プリセット</label>
        <select id="preset" class="select select-sm col-span-2">
          <option value="puru">ぷるぷる</option><option value="bain">ばいんばいん</option>
          <option value="buru">ぶるぶる</option><option value="fuwa">ふわふわ</option><option value="custom">カスタム</option>
        </select></div>
      <div class="row"><label for="hard">硬さ</label><input id="hard" type="range" min="0" max="100" class="range range-xs"><output id="hardO"></output></div>
      <div class="row"><label for="mass">質量</label><input id="mass" type="range" min="0" max="100" class="range range-xs"><output id="massO"></output></div>
      <div class="row"><label for="grav">重さ</label><input id="grav" type="range" min="0" max="100" value="15" class="range range-xs"><output id="gravO"></output></div>
      <div class="row"><label for="damp">おさまり</label><input id="damp" type="range" min="0" max="100" class="range range-xs"><output id="dampO"></output></div>
      <label class="flex items-center justify-between">自動で揺らす <input id="auto" type="checkbox" class="toggle toggle-sm" checked></label>
      <label class="flex items-center justify-between">揺れを止める <input id="pause" type="checkbox" class="toggle toggle-sm"></label>
    </section>

    <section class="flex flex-col gap-2">
      <h2 class="font-bold">表示</h2>
      <label class="flex items-center justify-between">ウェイトを重ねて表示 <input id="overlay" type="checkbox" class="toggle toggle-sm" checked></label>
      <label class="flex items-center justify-between">グリッド <input id="grid" type="checkbox" class="toggle toggle-sm"></label>
      <label class="flex items-center justify-between">陰影(MVP後の候補) <input id="shade" type="checkbox" class="toggle toggle-sm"></label>
      <div class="row"><label for="dens">メッシュ密度</label><input id="dens" type="range" min="16" max="256" step="16" value="128" class="range range-xs"><output id="densO"></output></div>
      <div class="row"><label for="fov">画角</label><input id="fov" type="range" min="10" max="90" value="40" class="range range-xs"><output id="fovO"></output></div>
    </section>

    <p class="opacity-70 leading-relaxed">画面と操作感を確かめるためのブラウザ版モックです。揺れはレイヤー単位のバネ、レイヤーは1枚、保存と書き出しはありません。画像はこのブラウザ内だけで処理されます。</p>
    <p id="err" class="text-error hidden"></p>
  </aside>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

const $ = id => document.getElementById(id);
const WN = 512;                       // ウェイトマップの解像度
const canvas = $('view'), stage = $('stage');

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { $('err').textContent = 'WebGL を初期化できませんでした。別のブラウザでお試しください。'; $('err').classList.remove('hidden'); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);

/* ---------- ウェイトマップ(CPU側が正本) ---------- */
const wc = document.createElement('canvas'); wc.width = wc.height = WN;
const wx = wc.getContext('2d', { willReadFrequently: true });
const wTex = new THREE.CanvasTexture(wc);
wTex.colorSpace = THREE.NoColorSpace; wTex.minFilter = wTex.magFilter = THREE.LinearFilter; wTex.generateMipmaps = false;
const clearW = () => { wx.globalCompositeOperation = 'source-over'; wx.setTransform(1,0,0,1,0,0); wx.fillStyle = '#000'; wx.fillRect(0,0,WN,WN); wTex.needsUpdate = true; };

/* ---------- 画像 ---------- */
const img = { w: 1024, h: 768, long: 1024, W: 2, H: 1.5 };
let mapTex = null;

const uniforms = {
  uMap: { value: null }, uW: { value: wTex }, uPop: { value: 0 }, uSwing: { value: new THREE.Vector3() },
  uOverlay: { value: 1 }, uGrid: { value: 0 }, uGridN: { value: new THREE.Vector2(128, 96) }, uShade: { value: 0 },
  uSize: { value: new THREE.Vector2(2, 1.5) }, uBrush: { value: new THREE.Vector3(0, 0, 0.1) }, uBrushOn: { value: 0 }
};
const material = new THREE.ShaderMaterial({
  uniforms, transparent: true, side: THREE.DoubleSide,
  vertexShader: `
    uniform sampler2D uW; uniform float uPop; uniform vec3 uSwing;
    varying vec2 vUv; varying vec2 vP;
    void main(){
      vUv = uv; vP = position.xy;
      float w = texture2D(uW, uv).r;
      vec3 p = position + w * (vec3(0.0, 0.0, uPop) + uSwing);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D uMap; uniform sampler2D uW;
    uniform float uPop, uOverlay, uGrid, uShade, uBrushOn;
    uniform vec2 uGridN, uSize; uniform vec3 uBrush;
    varying vec2 vUv; varying vec2 vP;
    void main(){
      vec4 c = texture2D(uMap, vUv);
      float w = texture2D(uW, vUv).r;
      if (uShade > 0.5) {
        float e = 1.5 / ${WN}.0;
        float dx = (texture2D(uW, vUv + vec2(e,0.)).r - texture2D(uW, vUv - vec2(e,0.)).r) * uPop / (2.*e*uSize.x);
        float dy = (texture2D(uW, vUv + vec2(0.,e)).r - texture2D(uW, vUv - vec2(0.,e)).r) * uPop / (2.*e*uSize.y);
        vec3 n = normalize(vec3(-dx, -dy, 1.));
        float l = dot(n, normalize(vec3(-0.45, 0.55, 0.7)));
        c.rgb *= clamp(0.45 + 0.8 * l, 0.35, 1.25);
      }
      c.rgb = mix(c.rgb, vec3(1.0, 0.2, 0.5), w * 0.5 * uOverlay);
      vec2 g = vUv * uGridN; vec2 d = abs(fract(g - 0.5) - 0.5) / fwidth(g);
      float line = (1.0 - min(min(d.x, d.y), 1.0)) * uGrid;
      c.rgb = mix(c.rgb, vec3(0.1, 0.75, 1.0), line * 0.7); c.a = max(c.a, line * 0.7);
      float r = length(vP - uBrush.xy); float fw = fwidth(r);
      float ring = (1.0 - smoothstep(fw, fw * 2.5, abs(r - uBrush.z))) * uBrushOn;
      c.rgb = mix(c.rgb, vec3(1.0), ring * 0.9); c.a = max(c.a, ring * 0.9);
      gl_FragColor = c;
      #include <colorspace_fragment>
    }`
});
let mesh = null;
function rebuildMesh() {
  const dens = +$('dens').value, nx = img.w >= img.h ? dens : Math.max(2, Math.round(dens * img.w / img.h)),
        ny = img.h > img.w ? dens : Math.max(2, Math.round(dens * img.h / img.w));
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  mesh = new THREE.Mesh(new THREE.PlaneGeometry(img.W, img.H, nx, ny), material);
  mesh.frustumCulled = false; scene.add(mesh);
  uniforms.uGridN.value.set(nx, ny);
  vertCount = (nx + 1) * (ny + 1);
}
let vertCount = 0;

function setImage(source, w, h) {
  const max = 2048, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  if (mapTex) mapTex.dispose();
  mapTex = new THREE.CanvasTexture(c); mapTex.colorSpace = THREE.SRGBColorSpace; mapTex.anisotropy = 4;
  uniforms.uMap.value = mapTex;
  img.w = c.width; img.h = c.height; img.long = Math.max(img.w, img.h);
  img.W = 2 * img.w / img.long; img.H = 2 * img.h / img.long;
  uniforms.uSize.value.set(img.W, img.H);
  clearW(); undo.length = redo.length = 0; syncUndo();
  rebuildMesh(); applyPop(); resetView();
}

/* サンプル画像(プリン)をその場で描く */
function drawSample() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 768; const g = c.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 768); gr.addColorStop(0, '#cfe8ef'); gr.addColorStop(1, '#f3e3c8'); g.fillStyle = gr; g.fillRect(0, 0, 1024, 768);
  g.fillStyle = '#e9cfa6'; g.fillRect(0, 610, 1024, 158);
  g.fillStyle = 'rgba(60,40,20,.18)'; g.beginPath(); g.ellipse(512, 668, 360, 44, 0, 0, 7); g.fill();
  g.fillStyle = '#fbfbf8'; g.beginPath(); g.ellipse(512, 640, 350, 62, 0, 0, 7); g.fill();
  g.fillStyle = '#e7e9e6'; g.beginPath(); g.ellipse(512, 646, 270, 40, 0, 0, 7); g.fill();
  gr = g.createLinearGradient(300, 0, 724, 0); gr.addColorStop(0, '#f2b63c'); gr.addColorStop(.45, '#ffdf80'); gr.addColorStop(1, '#eaa52a'); g.fillStyle = gr;
  g.beginPath(); g.moveTo(312, 630); g.quadraticCurveTo(350, 400, 398, 300); g.quadraticCurveTo(512, 262, 626, 300);
  g.quadraticCurveTo(674, 400, 712, 630); g.quadraticCurveTo(512, 690, 312, 630); g.fill();
  g.fillStyle = '#7a3d10'; g.beginPath(); g.moveTo(396, 304); g.quadraticCurveTo(512, 258, 628, 304);
  g.quadraticCurveTo(640, 352, 606, 346); g.quadraticCurveTo(590, 392, 562, 350); g.quadraticCurveTo(520, 372, 486, 348);
  g.quadraticCurveTo(462, 398, 440, 346); g.quadraticCurveTo(388, 356, 396, 304); g.fill();
  g.fillStyle = '#fffdf6'; for (const [x, y, r] of [[470, 262, 34], [512, 244, 40], [556, 262, 34], [512, 272, 38]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  g.strokeStyle = '#3c6b2a'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(514, 196); g.quadraticCurveTo(530, 150, 566, 140); g.stroke();
  g.fillStyle = '#d6263c'; g.beginPath(); g.arc(512, 214, 26, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(503, 205, 7, 0, 7); g.fill();
  g.fillStyle = '#4a2a12'; g.beginPath(); g.arc(462, 470, 11, 0, 7); g.arc(562, 470, 11, 0, 7); g.fill();
  g.strokeStyle = '#4a2a12'; g.lineWidth = 6; g.beginPath(); g.arc(512, 492, 26, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  g.fillStyle = 'rgba(240,120,110,.45)'; g.beginPath(); g.ellipse(428, 506, 22, 13, 0, 0, 7); g.ellipse(596, 506, 22, 13, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(392, 470, 16, 90, 0.12, 0, 7); g.fill();
  return c;
}
function loadSample() {
  const c = drawSample(); setImage(c, c.width, c.height);
  // 最初から触れるよう、プリン部分をあらかじめ塗っておく
  for (const [x, y, r, a] of [[512, 520, 230, .5], [512, 430, 210, .55], [512, 330, 170, .6], [512, 250, 120, .6], [512, 215, 70, .5]]) stamp(x / 1024, 1 - y / 768, r, a, 'brush');
  wTex.needsUpdate = true;
}

/* ---------- 塗り ---------- */
const undo = [], redo = [];
const syncUndo = () => { $('btnUndo').disabled = !undo.length; $('btnRedo').disabled = !redo.length; };
const snap = () => wx.getImageData(0, 0, WN, WN);
function pushUndo() { undo.push(snap()); if (undo.length > 20) undo.shift(); redo.length = 0; syncUndo(); }
function restore(from, to) { if (!from.length) return; to.push(snap()); wx.setTransform(1,0,0,1,0,0); wx.putImageData(from.pop(), 0, 0); wTex.needsUpdate = true; syncUndo(); }

// u,v: 0〜1(vは上が1) / rPx: 元画像のピクセル単位の半径 / a: 0〜1
function stamp(u, v, rPx, a, mode) {
  const sx = WN / img.w, sy = WN / img.h, cx = u * WN, cy = (1 - v) * WN;
  if (mode === 'smooth') return smoothAt(cx, cy, rPx * sx, rPx * sy, a);
  wx.setTransform(sx, 0, 0, sy, cx, cy);
  const col = mode === 'erase' ? '0,0,0' : '255,255,255';
  const g = wx.createRadialGradient(0, 0, 0, 0, 0, rPx);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.5, `rgba(${col},${a * 0.6})`); g.addColorStop(1, `rgba(${col},0)`);
  wx.globalCompositeOperation = mode === 'erase' ? 'source-over' : 'lighter';
  wx.fillStyle = g; wx.beginPath(); wx.arc(0, 0, rPx, 0, 7); wx.fill();
  wx.setTransform(1, 0, 0, 1, 0, 0); wx.globalCompositeOperation = 'source-over';
}
function smoothAt(cx, cy, rx, ry, a) {
  const x0 = Math.max(0, Math.floor(cx - rx)), y0 = Math.max(0, Math.floor(cy - ry)),
        x1 = Math.min(WN, Math.ceil(cx + rx)), y1 = Math.min(WN, Math.ceil(cy + ry)), w = x1 - x0, h = y1 - y0;
  if (w < 3 || h < 3) return;
  const id = wx.getImageData(x0, y0, w, h), d = id.data, src = new Float32Array(w * h), tmp = new Float32Array(w * h), R = 3;
  for (let i = 0; i < w * h; i++) src[i] = d[i * 4];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0, n = 0; for (let k = -R; k <= R; k++) { const xx = x + k; if (xx >= 0 && xx < w) { s += src[y * w + xx]; n++; } } tmp[y * w + x] = s / n; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, n = 0; for (let k = -R; k <= R; k++) { const yy = y + k; if (yy >= 0 && yy < h) { s += tmp[yy * w + x]; n++; } }
    const ex = (x + x0 - cx) / rx, ey = (y + y0 - cy) / ry, f = Math.max(0, 1 - Math.hypot(ex, ey)) * Math.min(1, a * 2.5);
    const val = src[y * w + x] * (1 - f) + (s / n) * f, i = (y * w + x) * 4; d[i] = d[i + 1] = d[i + 2] = val; d[i + 3] = 255;
  }
  wx.putImageData(id, x0, y0);
}

/* ---------- カメラ ---------- */
const cam = { yaw: -0.35, pitch: 0.25, zoom: 1, target: new THREE.Vector3() };
function resetView() { cam.yaw = -0.35; cam.pitch = 0.25; cam.zoom = 1; cam.target.set(0, 0, 0); }
function camDist() { return (Math.max(img.H, img.W / camera.aspect) * 0.62) / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * cam.zoom; }
function updateCamera() {
  const d = camDist(), cp = Math.cos(cam.pitch);
  camera.position.set(cam.target.x + d * Math.sin(cam.yaw) * cp, cam.target.y + d * Math.sin(cam.pitch), cam.target.z + d * Math.cos(cam.yaw) * cp);
  camera.lookAt(cam.target); camera.updateMatrixWorld();
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* ---------- 入力 ---------- */
let tool = 'brush';
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
function pick(e) {                      // 持ち上げる前の平面との交点
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1));
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return null;
  return { x: hit.x, y: hit.y, u: hit.x / img.W + 0.5, v: hit.y / img.H + 0.5 };
}
const drag = { mode: null, lx: 0, ly: 0, sx: 0, sy: 0, last: null };
const grabForce = new THREE.Vector3();
const brushR = () => +$('size').value / 2;               // 元画像のピクセル単位
function paintTo(p) {
  const a = +$('strength').value / 100 * 0.35, r = brushR(), stepW = Math.max(r * 0.25, 1) / img.long * 2;
  const from = drag.last || p, dist = Math.hypot(p.x - from.x, p.y - from.y), n = Math.max(1, Math.ceil(dist / stepW));
  for (let i = 1; i <= n; i++) { const t = i / n, x = from.x + (p.x - from.x) * t, y = from.y + (p.y - from.y) * t; stamp(x / img.W + 0.5, y / img.H + 0.5, r, a, tool); }
  drag.last = p; wTex.needsUpdate = true;
}
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); drag.lx = drag.sx = e.clientX; drag.ly = drag.sy = e.clientY; drag.last = null;
  if (e.button === 2 || (e.button === 0 && tool === 'view')) drag.mode = 'orbit';
  else if (e.button === 1) { drag.mode = 'pan'; e.preventDefault(); }
  else if (tool === 'grab') drag.mode = 'grab';
  else { const p = pick(e); if (p) { pushUndo(); drag.mode = 'paint'; paintTo(p); } }
});
canvas.addEventListener('pointermove', e => {
  const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY;
  const p = pick(e);
  if (p) { uniforms.uBrush.value.set(p.x, p.y, brushR() / img.long * 2); }
  uniforms.uBrushOn.value = (p && tool !== 'grab' && tool !== 'view' && drag.mode !== 'orbit' && drag.mode !== 'pan') ? 1 : 0;
  if (drag.mode === 'orbit') { cam.yaw -= dx * 0.008; cam.pitch = THREE.MathUtils.clamp(cam.pitch + dy * 0.008, -1.45, 1.45); }
  else if (drag.mode === 'pan' || drag.mode === 'grab') {
    const k = 2 * camDist() * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / canvas.clientHeight;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    if (drag.mode === 'pan') cam.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
    else { grabForce.set(0, 0, 0).addScaledVector(right, (e.clientX - drag.sx) * k).addScaledVector(up, -(e.clientY - drag.sy) * k); if (grabForce.length() > 0.7) grabForce.setLength(0.7); }
  }
  else if (drag.mode === 'paint' && p) paintTo(p);
});
const endDrag = () => { drag.mode = null; drag.last = null; grabForce.set(0, 0, 0); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => { uniforms.uBrushOn.value = 0; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = THREE.MathUtils.clamp(cam.zoom * Math.exp(e.deltaY * 0.0012), 0.25, 4); }, { passive: false });

function setTool(t) { tool = t; document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t)); canvas.style.cursor = t === 'grab' ? 'grab' : t === 'view' ? 'move' : 'crosshair'; }
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
window.addEventListener('keydown', e => {
  if (e.target.matches('input,select')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? restore(redo, undo) : restore(undo, redo); return; }
  const map = { b: 'brush', e: 'erase', s: 'smooth', g: 'grab', v: 'view' }; if (map[k]) setTool(map[k]);
  if (k === '[') { $('size').value = +$('size').value - 10; $('size').dispatchEvent(new Event('input')); }
  if (k === ']') { $('size').value = +$('size').value + 10; $('size').dispatchEvent(new Event('input')); }
});

/* ---------- 揺れ(レイヤー単位のバネ・ダンパ) ---------- */
const PRESETS = { puru: [45, 35, 12], bain: [15, 80, 8], buru: [90, 10, 30], fuwa: [12, 20, 70] };
const sw = { s: new THREE.Vector3(), v: new THREE.Vector3(), acc: 0, autoT: 0, autoDir: 1 };
const lerp = (a, b, t) => a + (b - a) * t;
function stepPhysics(dt) {
  const k = lerp(20, 400, $('hard').value / 100), m = lerp(0.3, 3, $('mass').value / 100), c = lerp(0.5, 12, $('damp').value / 100), gw = $('grav').value / 100 * 6;
  const f = new THREE.Vector3().copy(sw.s).multiplyScalar(-k).addScaledVector(sw.v, -c).addScaledVector(grabForce, 140);
  f.y -= gw * m;
  sw.v.addScaledVector(f, dt / m); sw.s.addScaledVector(sw.v, dt);
  if (sw.s.length() > 1.2) sw.s.setLength(1.2);
}
function tickPhysics(dt) {
  if ($('pause').checked) return;
  if ($('auto').checked && !drag.mode) {
    sw.autoT += dt;
    if (sw.autoT > 1.6) { sw.autoT = 0; sw.autoDir *= -1; sw.v.x += 1.1 * sw.autoDir; sw.v.y += 0.5; }
  }
  sw.acc = Math.min(sw.acc + dt, 0.1);
  while (sw.acc >= 1 / 120) { stepPhysics(1 / 120); sw.acc -= 1 / 120; }
  uniforms.uSwing.value.copy(sw.s);
}

/* ---------- パネル ---------- */
const applyPop = () => { uniforms.uPop.value = +$('pop').value / img.long * 2; };
const bind = (id, unit, fn) => { const el = $(id), o = $(id + 'O'); const f = () => { o.textContent = el.value + unit; fn && fn(); }; el.addEventListener('input', f); f(); };
function setPreset(name) { const p = PRESETS[name]; if (!p) return; $('hard').value = p[0]; $('mass').value = p[1]; $('damp').value = p[2]; ['hard', 'mass', 'damp'].forEach(i => $(i + 'O').textContent = $(i).value); }
setPreset('puru');
bind('size', 'px'); bind('strength', '%'); bind('pop', 'px', applyPop);
['hard', 'mass', 'damp'].forEach(i => bind(i, '', () => { $('preset').value = 'custom'; })); $('preset').value = 'puru';
bind('grav', ''); bind('dens', '', rebuildMesh);
bind('fov', '°', () => { camera.fov = +$('fov').value; camera.updateProjectionMatrix(); });
$('preset').addEventListener('change', e => setPreset(e.target.value));
$('overlay').addEventListener('change', e => uniforms.uOverlay.value = e.target.checked ? 1 : 0);
$('grid').addEventListener('change', e => uniforms.uGrid.value = e.target.checked ? 1 : 0);
$('shade').addEventListener('change', e => uniforms.uShade.value = e.target.checked ? 1 : 0);
$('pause').addEventListener('change', e => { if (e.target.checked) { sw.s.set(0, 0, 0); sw.v.set(0, 0, 0); uniforms.uSwing.value.set(0, 0, 0); } });
$('btnUndo').addEventListener('click', () => restore(undo, redo));
$('btnRedo').addEventListener('click', () => restore(redo, undo));
$('btnClear').addEventListener('click', () => { pushUndo(); clearW(); });
$('btnView').addEventListener('click', resetView);
$('btnSample').addEventListener('click', loadSample);

async function openFile(file) {
  if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) { showErr('PNG / JPEG / WebP の画像を選んでください。'); return; }
  try { const bmp = await createImageBitmap(file); setImage(bmp, bmp.width, bmp.height); bmp.close && bmp.close(); showErr(''); }
  catch (e) { showErr('画像を読み込めませんでした。別のファイルでお試しください。'); }
}
const showErr = t => { $('err').textContent = t; $('err').classList.toggle('hidden', !t); };
$('file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); openFile(e.dataTransfer.files[0]); });

/* ---------- ループ ---------- */
clearW(); loadSample(); resize(); setTool('brush');
let prev = performance.now(), frames = 0, fpsT = 0;
function loop(now) {
  const dt = Math.min((now - prev) / 1000, 0.1); prev = now;
  tickPhysics(dt); updateCamera(); renderer.render(scene, camera);
  frames++; fpsT += dt;
  if (fpsT >= 0.5) { $('stats').textContent = `${Math.round(frames / fpsT)} fps ・ ${vertCount.toLocaleString()} 頂点 ・ ${img.w}×${img.h}px`; frames = 0; fpsT = 0; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
